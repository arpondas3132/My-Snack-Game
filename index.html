<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worms Zone Ultimate Joystick Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
        }

        /* ----- LOBBY SCREEN ----- */
        #lobby {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lobby-title {
            font-size: 34px;
            font-weight: 800;
            color: #facc15;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .lobby-box {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 12px; color: #94a3b8; font-weight: bold; }
        .input-group input {
            padding: 8px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: #fff; font-size: 14px; outline: none;
        }

        .coins-display {
            font-size: 16px; color: #facc15; font-weight: bold; text-align: center;
            background: rgba(250, 204, 21, 0.1); padding: 8px; border-radius: 10px;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }

        .shop-tabs { display: flex; gap: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; padding: 5px 10px; font-size: 12px; }
        .tab-btn.active { color: #facc15; border-bottom: 2px solid #facc15; }

        .item-selector { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; }
        .item-card {
            min-width: 85px; padding: 8px; background: #0f172a;
            border: 2px solid #334155; border-radius: 10px; text-align: center; cursor: pointer;
        }
        .item-card.selected { border-color: #facc15; background: rgba(250, 204, 21, 0.1); }
        .skin-preview { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 4px; }
        .item-price { font-size: 11px; color: #facc15; margin-top: 2px; }

        .btn-start {
            padding: 12px; background: #22c55e; color: #fff; border: none;
            border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); margin-top: 5px;
        }

        /* ----- IN-GAME HUD ----- */
        #ui-overlay {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 8px 16px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: none;
        }
        .score-box { font-size: 18px; font-weight: bold; color: #4ade80; }
        .coin-box { font-size: 14px; color: #facc15; font-weight: bold; }

        #leaderboard {
            position: absolute; top: 12px; right: 12px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 10px 14px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); width: 160px; pointer-events: none;
        }
        #leaderboard h3 { font-size: 12px; color: #facc15; margin-bottom: 6px; text-transform: uppercase; }
        .lb-item { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
        .lb-item.player { color: #4ade80; font-weight: bold; }

        /* 🕹️ TOUCH JOYSTICK CONTROLS */
        #joystick-zone {
            position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; z-index: 20; backdrop-filter: blur(4px); touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(250, 204, 21, 0.8); border: 2px solid #fff;
            border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
        }

        #boost-btn {
            position: absolute; bottom: 35px; right: 35px; width: 75px; height: 75px;
            background: rgba(239, 68, 68, 0.6); border: 3px solid #ef4444;
            border-radius: 50%; color: #fff; font-size: 13px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; z-index: 20;
            backdrop-filter: blur(4px); touch-action: none;
        }

        #game-over {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 30; background: rgba(15, 23, 42, 0.95);
            padding: 25px 40px; border-radius: 18px; border: 2px solid #ef4444; text-align: center;
        }
    </style>
</head>
<body>

    <!-- 🚪 LOBBY -->
    <div id="lobby">
        <div class="lobby-title">🐍 Worms Zone</div>
        <div class="lobby-box">
            <div class="coins-display">🪙 Total Coins: <span id="lobbyCoinCount">67</span></div>
            
            <div class="input-group">
                <label>Player Name:</label>
                <input type="text" id="playerName" value="Player1" maxlength="12">
            </div>

            <div class="shop-tabs">
                <button class="tab-btn active" onclick="switchTab('skins')">Skins</button>
                <button class="tab-btn" onclick="switchTab('masks')">Nose / Masks</button>
            </div>

            <div class="item-selector" id="shopContainer"></div>

            <button class="btn-start" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <!-- 🎮 HUD & CONTROLS -->
    <div id="ui-overlay">
        <div class="score-box">Score: <span id="scoreVal">0</span></div>
        <div class="coin-box">🪙 Coins: <span id="gameCoinVal">67</span></div>
    </div>

    <div id="leaderboard">
        <h3>🏆 Scoreboard</h3>
        <div id="lb-list"></div>
    </div>

    <!-- Joystick and Boost Controls -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="boost-btn">BOOST</div>

    <div id="game-over">
        <h2 style="color:#ef4444; font-size: 26px;">💥 Game Over!</h2>
        <p id="deathReason" style="font-size: 13px; color: #cbd5e1; margin-top: 6px;"></p>
        <p style="margin-top: 10px; font-weight:bold;">Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 22px; background:#22c55e; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const MAP_SIZE = 3500;
        const MAX_FOOD_COUNT = 300;
        const MAX_COIN_COUNT = 35;

        // 🪙 ওল্ড পয়েন্ট/কয়েন ৬৭ সেট করা
        let totalCoins = parseInt(localStorage.getItem('wz_coins_v4')) || 67;
        document.getElementById('lobbyCoinCount').innerText = totalCoins;

        const SKINS = [
            { id: 'red', name: 'Ruby', color: '#e11d48', price: 0, unlocked: true },
            { id: 'blue', name: 'Cyan', color: '#06b6d4', price: 20, unlocked: false },
            { id: 'green', name: 'Emerald', color: '#10b981', price: 40, unlocked: false },
            { id: 'purple', name: 'Royal', color: '#8b5cf6', price: 50, unlocked: false },
            { id: 'gold', name: 'Gold', color: '#facc15', price: 65, unlocked: false }
        ];

        const MASKS = [
            { id: 'none', name: 'Normal', price: 0, unlocked: true },
            { id: 'pig', name: 'Pig 🐷', price: 25, unlocked: false },
            { id: 'ninja', name: 'Ninja 🥷', price: 45, unlocked: false },
            { id: 'crown', name: 'Crown 👑', price: 60, unlocked: false }
        ];

        let selectedSkin = SKINS[0];
        let selectedMask = MASKS[0];
        let currentTab = 'skins';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'skins') document.querySelectorAll('.tab-btn')[0].classList.add('active');
            else document.querySelectorAll('.tab-btn')[1].classList.add('active');
            renderShop();
        }

        function renderShop() {
            const container = document.getElementById('shopContainer');
            container.innerHTML = '';
            const list = currentTab === 'skins' ? SKINS : MASKS;

            list.forEach(item => {
                const isSelected = (currentTab === 'skins' && item.id === selectedSkin.id) || 
                                   (currentTab === 'masks' && item.id === selectedMask.id);

                const card = document.createElement('div');
                card.className = `item-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div style="font-weight:bold; font-size:11px;">${item.name}</div>
                    <div class="item-price">${item.unlocked ? 'Owned' : '🪙 ' + item.price}</div>
                `;
                card.onclick = () => {
                    if (item.unlocked) {
                        if (currentTab === 'skins') selectedSkin = item;
                        else selectedMask = item;
                    } else if (totalCoins >= item.price) {
                        totalCoins -= item.price;
                        item.unlocked = true;
                        if (currentTab === 'skins') selectedSkin = item;
                        else selectedMask = item;
                        localStorage.setItem('wz_coins_v4', totalCoins);
                        document.getElementById('lobbyCoinCount').innerText = totalCoins;
                    } else {
                        alert('পর্যাপ্ত কয়েন নেই!');
                    }
                    renderShop();
                };
                container.appendChild(card);
            });
        }
        renderShop();

        // 🕹️ Joystick Logics
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let moveAngle = null;
        let isBoosting = false;

        function handleJoystickMove(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const dx = clientX - centerX;
            const dy = clientY - centerY;
            const distance = Math.min(Math.hypot(dx, dy), 40);

            moveAngle = Math.atan2(dy, dx);
            const knobX = Math.cos(moveAngle) * distance + 35;
            const knobY = Math.sin(moveAngle) * distance + 35;

            joyKnob.style.left = knobX + 'px';
            joyKnob.style.top = knobY + 'px';
        }

        function resetJoystick() {
            moveAngle = null;
            joyKnob.style.left = '35px';
            joyKnob.style.top = '35px';
        }

        joyZone.addEventListener('touchstart', (e) => handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY));
        joyZone.addEventListener('touchmove', (e) => handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY));
        joyZone.addEventListener('touchend', resetJoystick);

        // Mouse Fallback for PC Joystick
        let isMouseJoy = false;
        joyZone.addEventListener('mousedown', (e) => { isMouseJoy = true; handleJoystickMove(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (isMouseJoy) handleJoystickMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isMouseJoy = false; resetJoystick(); });

        const boostBtn = document.getElementById('boost-btn');
        boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
        boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });
        boostBtn.addEventListener('mousedown', () => isBoosting = true);
        boostBtn.addEventListener('mouseup', () => isBoosting = false);

        class Food {
            constructor(x, y, value = 5) {
                this.x = x || Math.random() * (MAP_SIZE - 200) + 100;
                this.y = y || Math.random() * (MAP_SIZE - 200) + 100;
                this.radius = Math.min(12, 6 + value / 3);
                this.value = value;
                this.color = ['#ef4444', '#f97316', '#a855f7', '#38bdf8', '#4ade80'][Math.floor(Math.random() * 5)];
            }
            draw(camX, camY) {
                ctx.beginPath();
                ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class Coin {
            constructor() {
                this.x = Math.random() * (MAP_SIZE - 200) + 100;
                this.y = Math.random() * (MAP_SIZE - 200) + 100;
                this.radius = 8;
            }
            draw(camX, camY) {
                ctx.beginPath();
                ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Worm {
            constructor(id, name, x, y, color, mask, isBot = false) {
                this.id = id;
                this.name = name;
                this.x = x; this.y = y;
                this.color = color;
                this.mask = mask;
                this.isBot = isBot;
                this.radius = 12;
                this.speed = 3;
                this.angle = Math.random() * Math.PI * 2;
                this.score = 0;
                this.segments = [];
                this.length = 18;
                this.isDead = false;

                for (let i = 0; i < this.length; i++) this.segments.push({ x, y });
            }

            update(targetAngle, boosting) {
                if (this.isDead) return;
                this.speed = boosting ? 5.2 : 3;

                if (targetAngle !== null) {
                    let diff = targetAngle - this.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    this.angle += diff * 0.12;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Border die
                if (this.x <= 40 || this.x >= MAP_SIZE - 40 || this.y <= 40 || this.y >= MAP_SIZE - 40) {
                    this.die();
                }

                this.segments.unshift({ x: this.x, y: this.y });
                while (this.segments.length > this.length) this.segments.pop();

                // 📈 ধীর ও বাস্তবসম্মত বৃদ্ধি (Slow Growth)
                this.radius = 12 + Math.min(22, this.score / 250);
            }

            draw(camX, camY) {
                if (this.isDead) return;

                for (let i = this.segments.length - 1; i >= 1; i -= 2) {
                    const seg = this.segments[i];
                    ctx.beginPath();
                    ctx.arc(seg.x - camX, seg.y - camY, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }

                // Head
                const hX = this.x - camX;
                const hY = this.y - camY;
                ctx.save();
                ctx.translate(hX, hY);
                ctx.rotate(this.angle);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 1, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Eyes
                ctx.beginPath();
                ctx.arc(this.radius * 0.3, -5, 3.5, 0, Math.PI * 2);
                ctx.arc(this.radius * 0.3, 5, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.radius * 0.4, -5, 1.8, 0, Math.PI * 2);
                ctx.arc(this.radius * 0.4, 5, 1.8, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();

                ctx.restore();
            }

            die() {
                if (this.isDead) return;
                this.isDead = true;
                // দেহ খাবারে পরিণত হওয়া
                for (let i = 0; i < this.segments.length; i += 2) {
                    const seg = this.segments[i];
                    foods.push(new Food(seg.x + (Math.random() - 0.5) * 15, seg.y + (Math.random() - 0.5) * 15, 8));
                }
            }
        }

        let playerWorm;
        const bots = [];
        const foods = [];
        const coins = [];
        const BOT_NAMES = ['Cobra', 'Viper', 'Titan', 'Apex', 'Slayer', 'Python', 'Shadow'];
        const BOT_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

        function spawnBot(id) {
            const x = Math.random() * (MAP_SIZE - 600) + 300;
            const y = Math.random() * (MAP_SIZE - 600) + 300;
            const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
            const color = BOT_COLORS[Math.floor(Math.random() * BOT_COLORS.length)];
            return new Worm(id, name, x, y, color, 'none', true);
        }

        function startGame() {
            const name = document.getElementById('playerName').value || 'Player';
            playerWorm = new Worm(0, name, MAP_SIZE / 2, MAP_SIZE / 2, selectedSkin.color, selectedMask.id, false);
            document.getElementById('lobby').style.display = 'none';

            for (let i = 1; i <= 18; i++) bots.push(spawnBot(i));
            for (let i = 0; i < MAX_FOOD_COUNT; i++) foods.push(new Food());
            for (let i = 0; i < MAX_COIN_COUNT; i++) coins.push(new Coin());

            document.getElementById('gameCoinVal').innerText = totalCoins;
            animate();
        }

        function updateLeaderboard() {
            const all = [playerWorm, ...bots.filter(b => !b.isDead)];
            all.sort((a, b) => b.score - a.score);

            const lbList = document.getElementById('lb-list');
            lbList.innerHTML = '';
            all.slice(0, 5).forEach((w, idx) => {
                const item = document.createElement('div');
                item.className = 'lb-item' + (w === playerWorm ? ' player' : '');
                item.innerHTML = `<span>${idx + 1}. ${w.name}</span> <span>${Math.floor(w.score)}</span>`;
                lbList.appendChild(item);
            });
        }

        function animate() {
            if (playerWorm.isDead) {
                document.getElementById('deathReason').innerText = "You crashed and turned into food!";
                document.getElementById('finalScore').innerText = playerWorm.score;
                document.getElementById('game-over').style.display = 'block';
                localStorage.setItem('wz_coins_v4', totalCoins);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const camX = playerWorm.x - canvas.width / 2;
            const camY = playerWorm.y - canvas.height / 2;

            // Border
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 10;
            ctx.strokeRect(40 - camX, 40 - camY, MAP_SIZE - 80, MAP_SIZE - 80);

            // Coins
            coins.forEach((c, idx) => {
                c.draw(camX, camY);
                if (Math.hypot(playerWorm.x - c.x, playerWorm.y - c.y) < playerWorm.radius + c.radius) {
                    coins.splice(idx, 1);
                    totalCoins++;
                    document.getElementById('gameCoinVal').innerText = totalCoins;
                    coins.push(new Coin());
                }
            });

            // Food Collection (Player & Bots)
            foods.forEach((f, idx) => {
                f.draw(camX, camY);

                if (Math.hypot(playerWorm.x - f.x, playerWorm.y - f.y) < playerWorm.radius + f.radius) {
                    foods.splice(idx, 1);
                    playerWorm.length += 0.15;
                    playerWorm.score += f.value;
                    document.getElementById('scoreVal').innerText = playerWorm.score;
                    if (foods.length < MAX_FOOD_COUNT) foods.push(new Food());
                }

                bots.forEach(bot => {
                    if (!bot.isDead && Math.hypot(bot.x - f.x, bot.y - f.y) < bot.radius + f.radius) {
                        foods.splice(idx, 1);
                        bot.length += 0.15;
                        bot.score += f.value;
                        if (foods.length < MAX_FOOD_COUNT) foods.push(new Food());
                    }
                });
            });

            // Player Update
            playerWorm.update(moveAngle, isBoosting);
            playerWorm.draw(camX, camY);

            const activeWorms = [playerWorm, ...bots.filter(b => !b.isDead)];

            // Smart Bots Logic & Collision
            bots.forEach((bot, bIdx) => {
                if (bot.isDead) return;

                // AI Steering towards food
                let nearestFood = null;
                let minDist = 250;
                foods.forEach(f => {
                    const d = Math.hypot(bot.x - f.x, bot.y - f.y);
                    if (d < minDist) { minDist = d; nearestFood = f; }
                });

                if (nearestFood) {
                    bot.angle = Math.atan2(nearestFood.y - bot.y, nearestFood.x - bot.x);
                } else if (Math.random() < 0.03) {
                    bot.angle += (Math.random() - 0.5);
                }

                bot.update(bot.angle, false);
                bot.draw(camX, camY);

                // 💥 বটের শরীর স্পর্শ করলে অন্য বটের মৃত্যু
                activeWorms.forEach(other => {
                    if (other === bot || other.isDead) return;
                    for (let i = 4; i < other.segments.length; i += 2) {
                        const seg = other.segments[i];
                        if (Math.hypot(bot.x - seg.x, bot.y - seg.y) < bot.radius + other.radius - 3) {
                            bot.die();
                            setTimeout(() => { bots[bIdx] = spawnBot(bot.id); }, 3000);
                            break;
                        }
                    }
                });

                // 💥 প্লেয়ারের মুখ অন্য সাপের গায়ে লাগলে প্লেয়ারের মৃত্যু
                if (!bot.isDead) {
                    for (let i = 4; i < bot.segments.length; i += 2) {
                        const seg = bot.segments[i];
                        if (Math.hypot(playerWorm.x - seg.x, playerWorm.y - seg.y) < playerWorm.radius + bot.radius - 3) {
                            playerWorm.die();
                        }
                    }
                }
            });

            updateLeaderboard();
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
