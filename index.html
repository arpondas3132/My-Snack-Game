<!DOCTYPE html>
<html lang="bn">
<head><meta name="google-site-verification" content="zY-fVB5WijbwAfFVfx8u5J-cSeIfIZnz0shB_rqkBlo" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worms Zone Pro - Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #050811;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            touch-action: none;
        }

        #gameCanvas { display: block; }

        /* ----- LOBBY SCREEN ----- */
        #lobby {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1e293b, #090d16);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lobby-title {
            font-size: 38px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .lobby-box {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .coins-display {
            font-size: 20px; color: #facc15; font-weight: bold; text-align: center;
            background: rgba(250, 204, 21, 0.15); padding: 10px; border-radius: 12px;
            border: 1px solid rgba(250, 204, 21, 0.4);
        }

        .skin-selector {
            display: flex; gap: 10px; overflow-x: auto; padding: 8px 0;
        }
        .skin-card {
            min-width: 75px; padding: 10px; background: #0f172a;
            border: 2px solid #334155; border-radius: 12px; text-align: center; cursor: pointer;
        }
        .skin-card.selected { border-color: #facc15; background: rgba(250, 204, 21, 0.2); }
        .skin-color { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 5px; }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 12px; color: #94a3b8; font-weight: bold; }
        .input-group input {
            padding: 10px; border-radius: 10px; border: 1px solid #334155;
            background: #0f172a; color: #fff; font-size: 14px; outline: none;
        }

        .btn-start {
            padding: 14px; background: #22c55e; color: #fff; border: none;
            border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4); margin-top: 5px;
        }

        /* ----- IN-GAME HUD ----- */
        #ui-overlay {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 10px 16px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: none;
        }
        .score-box { font-size: 18px; font-weight: bold; color: #4ade80; }
        .coin-box { font-size: 14px; color: #facc15; font-weight: bold; margin-top: 2px; }

        /* 🔔 KILL NOTIFICATION */
        #kill-notify {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 30; background: rgba(239, 68, 68, 0.9); color: #fff;
            padding: 8px 20px; border-radius: 30px; font-weight: bold; font-size: 14px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); display: none; pointer-events: none;
        }

        #leaderboard {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); padding: 10px 14px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2); width: 160px; pointer-events: none;
        }
        #leaderboard h3 { font-size: 12px; color: #facc15; margin-bottom: 6px; text-transform: uppercase; }
        .lb-item { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
        .lb-item.player { color: #4ade80; font-weight: bold; }

        /* 🕹️ TOUCH JOYSTICK CONTROLLER */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px;
            z-index: 20; display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }
        #joystick-base {
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            position: relative; backdrop-filter: blur(5px);
        }
        #joystick-stick {
            width: 50px; height: 50px; background: #ef4444;
            border: 2px solid #fff; border-radius: 50%; position: absolute;
            top: 35px; left: 35px; box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            pointer-events: none;
        }

        #boost-btn-container { position: absolute; bottom: 40px; right: 40px; z-index: 20; }
        .boost-btn {
            width: 75px; height: 75px; background: rgba(239, 68, 68, 0.7);
            border: 2px solid #ef4444; border-radius: 50%; color: #fff;
            font-size: 12px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; backdrop-filter: blur(5px);
        }

        #game-over {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); z-index: 40; background: rgba(15, 23, 42, 0.95);
            padding: 25px 45px; border-radius: 20px; border: 2px solid #ef4444; text-align: center;
        }
    </style>
</head>
<body>

    <!-- 🚪 LOBBY -->
    <div id="lobby">
        <div class="lobby-title">🐍 Worms Zone Pro</div>
        <div class="lobby-box">
            <div class="coins-display">🪙 Coins: <span id="lobbyCoinCount">999999</span></div>
            
            <div class="input-group">
                <label>Player Name:</label>
                <input type="text" id="playerName" value="Player1" maxlength="12">
            </div>

            <div class="input-group">
                <label>Choose Skin Color:</label>
                <div class="skin-selector">
                    <div class="skin-card selected" onclick="selectSkin('#e11d48', this)"><div class="skin-color" style="background:#e11d48"></div>Red</div>
                    <div class="skin-card" onclick="selectSkin('#06b6d4', this)"><div class="skin-color" style="background:#06b6d4"></div>Cyan</div>
                    <div class="skin-card" onclick="selectSkin('#10b981', this)"><div class="skin-color" style="background:#10b981"></div>Emerald</div>
                    <div class="skin-card" onclick="selectSkin('#facc15', this)"><div class="skin-color" style="background:#facc15"></div>Gold</div>
                    <div class="skin-card" onclick="selectSkin('#a855f7', this)"><div class="skin-color" style="background:#a855f7"></div>Purple</div>
                </div>
            </div>

            <button class="btn-start" onclick="startGame()">PLAY GAME</button>
        </div>
    </div>

    <!-- 🎮 HUD -->
    <div id="ui-overlay">
        <div class="score-box">Score: <span id="scoreVal">0</span></div>
        <div class="coin-box">🪙 Coins: <span id="gameCoinVal">999999</span></div>
    </div>

    <div id="kill-notify">💥 You Killed a Snake!</div>

    <div id="leaderboard">
        <h3>🏆 Top Worms</h3>
        <div id="lb-list"></div>
    </div>

    <!-- 🕹️ JOYSTICK CONTROLLER -->
    <div id="joystick-zone">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <div id="boost-btn-container">
        <div class="boost-btn" id="boostBtn">BOOST</div>
    </div>

    <div id="game-over">
        <h2 style="color:#ef4444; font-size:26px;">💥 Game Over!</h2>
        <p id="deathReason" style="font-size: 13px; color: #cbd5e1; margin-top: 5px;"></p>
        <p style="margin-top: 10px; font-weight:bold;">Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 22px; background:#22c55e; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const MAP_SIZE = 4000;
        const MAX_FOOD_COUNT = 350;
        const MAX_COIN_COUNT = 40;
        const MAX_BOTS = 22;

        let totalCoins = 999999;
        let selectedColor = '#e11d48';

        function selectSkin(color, el) {
            selectedColor = color;
            document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        let isBoosting = false;
        let isGameOver = false;
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };

        // 🕹️ TOUCH JOYSTICK LOGIC (Mobile Smooth Handling)
        const jZone = document.getElementById('joystick-zone');
        const jBase = document.getElementById('joystick-base');
        const jStick = document.getElementById('joystick-stick');

        function handleJoystick(touchX, touchY) {
            const rect = jBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touchX - centerX;
            let dy = touchY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 40;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            jStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector = { x: dx / maxRadius, y: dy / maxRadius };
        }

        jZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
            handleJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (joystickActive && e.touches.length > 0) {
                handleJoystick(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            joystickActive = false;
            jStick.style.transform = `translate(0px, 0px)`;
            joystickVector = { x: 0, y: 0 };
        });

        // Mouse Controls fallback for PC
        window.addEventListener('mousemove', (e) => {
            if(!playerWorm || joystickActive) return;
            const dx = e.clientX - canvas.width / 2;
            const dy = e.clientY - canvas.height / 2;
            const dist = Math.hypot(dx, dy);
            if(dist > 10) joystickVector = { x: dx / dist, y: dy / dist };
        });

        const boostBtn = document.getElementById('boostBtn');
        boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
        boostBtn.addEventListener('touchend', () => isBoosting = false);
        window.addEventListener('mousedown', () => isBoosting = true);
        window.addEventListener('mouseup', () => isBoosting = false);

        // 🔔 Kill Notification Trigger
        function showKillNotify(text) {
            const notify = document.getElementById('kill-notify');
            notify.innerText = text;
            notify.style.display = 'block';
            setTimeout(() => { notify.style.display = 'none'; }, 2500);
        }

        class Food {
            constructor(x, y, radius, score) {
                this.x = x || Math.random() * (MAP_SIZE - 200) + 100;
                this.y = y || Math.random() * (MAP_SIZE - 200) + 100;
                this.radius = radius || (Math.random() * 3 + 4);
                this.score = score || Math.floor(this.radius);
                this.color = ['#ef4444', '#f97316', '#a855f7', '#38bdf8', '#4ade80'][Math.floor(Math.random() * 5)];
            }
            draw(camX, camY) {
                ctx.beginPath();
                ctx.arc(this.x - camX, this.y - camY, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        class BigGoldCoin {
            constructor() {
                this.x = Math.random() * (MAP_SIZE - 200) + 100;
                this.y = Math.random() * (MAP_SIZE - 200) + 100;
                this.radius = 12; // 🪙 খাদ্যের চেয়ে বড় গোল্ডেন কয়েন
            }
            draw(camX, camY) {
                const screenX = this.x - camX;
                const screenY = this.y - camY;

                ctx.beginPath();
                ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.fillStyle = '#b45309';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🪙', screenX, screenY);
            }
        }

        class Worm {
            constructor(id, name, x, y, color, isBot = false) {
                this.id = id;
                this.name = name;
                this.x = x; this.y = y;
                this.color = color;
                this.isBot = isBot;
                this.radius = 12;
                this.speed = 3;
                this.angle = Math.random() * Math.PI * 2;
                this.score = 0;
                this.segments = [];
                this.length = 25;
                this.isDead = false;

                for (let i = 0; i < this.length; i++) this.segments.push({ x: this.x, y: this.y });
            }

            update(dirVector, boosting) {
                if (this.isDead) return;
                this.speed = boosting ? 5.5 : 3.0;

                if (dirVector.x !== 0 || dirVector.y !== 0) {
                    const targetAngle = Math.atan2(dirVector.y, dirVector.x);
                    let diff = targetAngle - this.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    this.angle += diff * 0.14;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Wall Collision
                if (this.x <= 40 || this.x >= MAP_SIZE - 40 || this.y <= 40 || this.y >= MAP_SIZE - 40) {
                    this.die(null);
                    return;
                }

                this.segments.unshift({ x: this.x, y: this.y });
                while (this.segments.length > this.length) this.segments.pop();

                // 📈 ধীর ও স্বাভাবিক বৃদ্ধি (Slow Natural Growth)
                this.radius = 12 + Math.min(26, this.score / 400);
            }

            draw(camX, camY) {
                if (this.isDead) return;

                for (let i = this.segments.length - 1; i >= 1; i -= 2) {
                    const seg = this.segments[i];
                    ctx.beginPath();
                    ctx.arc(seg.x - camX, seg.y - camY, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }

                // Head
                const hX = this.x - camX;
                const hY = this.y - camY;
                ctx.save();
                ctx.translate(hX, hY);
                ctx.rotate(this.angle);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 1, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Eyes
                const eyeOffset = this.radius * 0.4;
                ctx.beginPath();
                ctx.arc(this.radius * 0.3, -eyeOffset, 3.8, 0, Math.PI * 2);
                ctx.arc(this.radius * 0.3, eyeOffset, 3.8, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.radius * 0.4, -eyeOffset, 2, 0, Math.PI * 2);
                ctx.arc(this.radius * 0.4, eyeOffset, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();

                ctx.restore();
            }

            die(killer) {
                if (this.isDead) return;
                this.isDead = true;

                // 💥 মারা গেলে সম্পূর্ণ বডি খাদ্যে রূপান্তরিত হবে
                for (let i = 0; i < this.segments.length; i += 2) {
                    const seg = this.segments[i];
                    foods.push(new Food(seg.x + (Math.random() - 0.5) * 20, seg.y + (Math.random() - 0.5) * 20, Math.random() * 4 + 6, 10));
                }

                if (killer === playerWorm) {
                    showKillNotify(`💥 You Killed ${this.name}!`);
                }
            }
        }

        let playerWorm;
        const bots = [];
        const foods = [];
        const coins = [];

        const BOT_NAMES = ['Alpha', 'Viper', 'Shadow', 'Apex', 'Phantom', 'Venom', 'Dragon', 'Hunter', 'Slayer'];
        const COLORS = ['#06b6d4', '#10b981', '#8b5cf6', '#f59e0b', '#ec4899', '#3b82f6'];

        function spawnBot() {
            const x = Math.random() * (MAP_SIZE - 600) + 300;
            const y = Math.random() * (MAP_SIZE - 600) + 300;
            const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            bots.push(new Worm(Date.now() + Math.random(), name, x, y, color, true));
        }

        function startGame() {
            const pName = document.getElementById('playerName').value || 'Player';
            playerWorm = new Worm(0, pName, MAP_SIZE / 2, MAP_SIZE / 2, selectedColor, false);
            document.getElementById('lobby').style.display = 'none';

            for (let i = 0; i < MAX_BOTS; i++) spawnBot();
            for (let i = 0; i < MAX_FOOD_COUNT; i++) foods.push(new Food());
            for (let i = 0; i < MAX_COIN_COUNT; i++) coins.push(new BigGoldCoin());

            animate();
        }

        function updateLeaderboard() {
            const all = [playerWorm, ...bots.filter(b => !b.isDead)].sort((a, b) => b.score - a.score);
            const lb = document.getElementById('lb-list');
            lb.innerHTML = '';
            all.slice(0, 5).forEach((w, i) => {
                const item = document.createElement('div');
                item.className = 'lb-item' + (w === playerWorm ? ' player' : '');
                item.innerHTML = `<span>${i + 1}. ${w.name}</span> <span>${Math.floor(w.score)}</span>`;
                lb.appendChild(item);
            });
        }

        function animate() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const camX = playerWorm.x - canvas.width / 2;
            const camY = playerWorm.y - canvas.height / 2;

            // Border
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 12;
            ctx.strokeRect(40 - camX, 40 - camY, MAP_SIZE - 80, MAP_SIZE - 80);

            // Gold Coins Collection
            coins.forEach((c, idx) => {
                c.draw(camX, camY);
                if (Math.hypot(playerWorm.x - c.x, playerWorm.y - c.y) < playerWorm.radius + c.radius) {
                    coins.splice(idx, 1);
                    totalCoins += 10;
                    document.getElementById('gameCoinVal').innerText = totalCoins;
                    coins.push(new BigGoldCoin());
                }
            });

            // Food Collection
            foods.forEach((f, idx) => {
                f.draw(camX, camY);
                if (Math.hypot(playerWorm.x - f.x, playerWorm.y - f.y) < playerWorm.radius + f.radius) {
                    foods.splice(idx, 1);
                    playerWorm.length += 0.12;
                    playerWorm.score += f.score;
                    document.getElementById('scoreVal').innerText = playerWorm.score;
                    if(foods.length < MAX_FOOD_COUNT) foods.push(new Food());
                }

                bots.forEach(b => {
                    if(!b.isDead && Math.hypot(b.x - f.x, b.y - f.y) < b.radius + f.radius) {
                        foods.splice(idx, 1);
                        b.length += 0.12;
                        b.score += f.score;
                        if(foods.length < MAX_FOOD_COUNT) foods.push(new Food());
                    }
                });
            });

            // Player Movement
            playerWorm.update(joystickVector, isBoosting);
            if (playerWorm.isDead) {
                isGameOver = true;
                document.getElementById('deathReason').innerText = "You crashed into wall/another worm!";
                document.getElementById('finalScore').innerText = playerWorm.score;
                document.getElementById('game-over').style.display = 'block';
                return;
            }
            playerWorm.draw(camX, camY);

            const activeWorms = [playerWorm, ...bots.filter(b => !b.isDead)];

            // 🧠 Ultra-Smart Bots Logic & Collisions
            bots.forEach((bot, bIdx) => {
                if (bot.isDead) return;

                if (Math.random() < 0.04) {
                    let dirX = Math.cos(bot.angle);
                    let dirY = Math.sin(bot.angle);

                    // 🧠 খাবার খুঁজতে ছুটে যাওয়া
                    foods.slice(0, 15).forEach(f => {
                        if(Math.hypot(bot.x - f.x, bot.y - f.y) < 200) {
                            dirX = f.x - bot.x;
                            dirY = f.y - bot.y;
                        }
                    });

                    bot.targetVector = { x: dirX, y: dirY };
                }

                bot.update(bot.targetVector || { x: Math.cos(bot.angle), y: Math.sin(bot.angle) }, false);
                bot.draw(camX, camY);

                // 💥 বটের সাথে অন্য সাপের গায়ে লেগে মৃত্যু
                activeWorms.forEach(other => {
                    if (other === bot || other.isDead) return;
                    for (let i = 4; i < other.segments.length; i += 2) {
                        const seg = other.segments[i];
                        if (Math.hypot(bot.x - seg.x, bot.y - seg.y) < bot.radius + other.radius - 2) {
                            bot.die(other);
                            bots.splice(bIdx, 1);
                            setTimeout(spawnBot, 2000);
                            break;
                        }
                    }
                });

                // 💥 প্লেয়ারের মাথা বটের গায়ে লাগলে মৃত্যু
                for (let i = 4; i < bot.segments.length; i += 2) {
                    const seg = bot.segments[i];
                    if (Math.hypot(playerWorm.x - seg.x, playerWorm.y - seg.y) < playerWorm.radius + bot.radius - 2) {
                        playerWorm.die(bot);
                        isGameOver = true;
                        document.getElementById('deathReason').innerText = `You crashed into ${bot.name}!`;
                        document.getElementById('finalScore').innerText = playerWorm.score;
                        document.getElementById('game-over').style.display = 'block';
                    }
                }
            });

            updateLeaderboard();
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
